version: "3.8"

services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: remitlend
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/${OWNER}/remitlend-backend:${TAG}
    env_file:
      - ./backend/.env.staging
    environment:
      - DATABASE_URL=${DATABASE_URL:?set-DATABASE_URL-in-server-env}
      - REDIS_URL=redis://redis:6379
      - PII_KEK_ID=${PII_KEK_ID}
      - PII_KMS_ENDPOINT=${PII_KMS_ENDPOINT}
      - PII_KEK_REGION=${PII_KEK_REGION}
      - LOG_REDACTION=strict
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    image: ghcr.io/${OWNER}/remitlend-frontend:${TAG}
    ports:
      - "3000:3000"
    environment:
      
      - API_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
