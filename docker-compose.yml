services:
  db:
    image: postgres:16.9-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remitlend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remitlend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6380:6379"


  backend:
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/remitlend
      - REDIS_URL=redis://redis:6379
      - PII_KEK_ID=${PII_KEK_ID:-default-kek}
      - PII_KMS_ENDPOINT=${PII_KMS_ENDPOINT:-}
      - PII_KEK_REGION=${PII_KEK_REGION:-}
      - PII_KEK_KEY=${PII_KEK_KEY:-}
      - LOG_REDACTION=${LOG_REDACTION:-strict}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001 # Client-side URL
      - API_URL=http://backend:3001 # Server-side URL
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

